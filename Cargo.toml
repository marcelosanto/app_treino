[package]
name = "app_treino"
version = "0.1.1"
authors = ["Marcelo Santos <rocha.mer21@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.5" }
chrono = "0.4.44"
uuid = { version = "1.23.0", features = ["v4"] }
rusqlite = "0.39.0"

[features]
desktop = ["dioxus/desktop"]
default = ["desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
